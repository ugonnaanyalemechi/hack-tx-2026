services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # FastAPI app. The LangGraph runtime runs in-process here (it is a library, not a
  # separate service). Applies migrations and seeds users + the demo agent on start.
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build: ./web
    environment:
      # Defaults to "mock" (fixtures, no runtime needed). WEB_API_MODE=live calls the api service through
      # the /api rewrite; add ?api=live to a page URL
      # to try the real backend for one page load.
      NEXT_PUBLIC_API_MODE: ${WEB_API_MODE:-mock}
      NEXT_PUBLIC_API_BASE_URL: /api
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
